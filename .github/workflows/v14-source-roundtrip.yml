name: V14 source and overlay build

on:
  push:
    branches: [v14-development]
  pull_request:
    branches: [v14-development]

permissions:
  contents: read

jobs:
  source-and-overlay:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run source-tool unit tests
        run: PYTHONPATH=tools python -m unittest -v tools/test_v14_source.py

      - name: Run V14 overlay-build unit tests
        run: PYTHONPATH=tools python -m unittest -v tools/test_v14_build.py

      - name: Check V14 module JavaScript syntax
        run: |
          node --check src/v14/shell/notifications.js
          node --check src/v14/shell/dialogs.js
          node --check src/v14/shell/commands.js
          node --check src/v14/shell/files.js
          node --check src/v14/dev-status/dev-status.js

      - name: Run shell notification behavior test
        run: node tools/test_v14_notifications.mjs src/v14/shell/notifications.js

      - name: Run dialog shell behavior test
        run: node tools/test_v14_dialogs.mjs src/v14/shell/dialogs.js

      - name: Run command palette behavior test
        run: node tools/test_v14_commands.mjs src/v14/shell/commands.js

      - name: Run file utility behavior test
        run: node tools/test_v14_files.mjs src/v14/shell/files.js

      - name: Verify frozen V14 baseline
        run: python tools/v14_source.py verify-lock --input index.html --lock src/source.lock.json

      - name: Extract current runtime losslessly
        run: python tools/v14_source.py extract --input index.html --out .v14-source-check --lock src/source.lock.json --force

      - name: Check byte-for-byte source round-trip
        run: python tools/v14_source.py check --input index.html --source .v14-source-check --lock src/source.lock.json

      - name: Build V14 development artifact
        run: python tools/v14_build.py --repo-root . --manifest src/v14/manifest.json --output-dir v14-dist --force

      - name: Verify overlay artifact structure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('v14-dist')
          manifest = json.loads((root / 'v14-build-manifest.json').read_text('utf-8'))
          html = (root / 'index.html').read_text('utf-8')
          assert manifest['schema'] == 'atelier-v14-development-build-v1'
          assert manifest['version'] == '14.0.0-dev.7'
          assert manifest['developmentOnly'] is True
          assert manifest['baseline']['runtimeRelease'] == '13.2.0'
          assert len(manifest['patches']) == 4
          patch_map = {patch['id']: patch for patch in manifest['patches']}
          assert set(patch_map) == {'shell-notifications-bridge', 'shell-dialogs-bridge', 'shell-commands-bridge', 'shell-files-bridge'}
          assert len(patch_map['shell-notifications-bridge']['changes']) == 3
          assert len(patch_map['shell-dialogs-bridge']['changes']) == 3
          assert len(patch_map['shell-commands-bridge']['changes']) == 2
          assert len(patch_map['shell-files-bridge']['changes']) == 2
          assert all(change['occurrences'] == 1 for patch in manifest['patches'] for change in patch['changes'])
          assert '<!-- ATELIER_V14_STYLES:BEGIN -->' in html
          assert '<!-- ATELIER_V14_MODULES:BEGIN -->' in html
          assert 'v14/dev-status/dev-status.css' in html
          assert 'v14/shell/notifications.js' in html
          assert 'v14/shell/dialogs.js' in html
          assert 'v14/shell/commands.js' in html
          assert 'v14/shell/files.js' in html
          assert 'v14/dev-status/dev-status.js' in html
          assert 'AtelierV14Shell?.notifications?.announce' in html
          assert 'AtelierV14Shell?.dialogs' in html
          assert 'AtelierV14Shell?.commands' in html
          assert 'AtelierV14Shell?.files' in html
          assert (root / 'v14/dev-status/dev-status.css').is_file()
          assert (root / 'v14/shell/notifications.js').is_file()
          assert (root / 'v14/shell/dialogs.js').is_file()
          assert (root / 'v14/shell/commands.js').is_file()
          assert (root / 'v14/shell/files.js').is_file()
          assert (root / 'v14/dev-status/dev-status.js').is_file()
          print('V14_ARTIFACT_STRUCTURE_OK=true')
          PY

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Run generated-artifact browser smoke
        env:
          V14_SMOKE_URL: http://127.0.0.1:4173/
        run: |
          python -m http.server 4173 --directory v14-dist >/tmp/atelier-v14-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:4173/ >/dev/null
          npx playwright test tools/v14-shell-smoke.spec.js --reporter=line --workers=1

      - name: Upload V14 development artifact
        uses: actions/upload-artifact@v4
        with:
          name: atelier-v14-dev.7
          path: v14-dist
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

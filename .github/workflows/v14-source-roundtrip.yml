name: V14 source, RC staging and physical evidence runner

on:
  push:
    branches: [v14-development]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [v14-development]
    paths-ignore:
      - '**/*.md'

concurrency:
  group: v14-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  source-packaging-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run deterministic unit tests
        run: |
          PYTHONPATH=tools python -m unittest -v tools/test_v14_source.py
          PYTHONPATH=tools python -m unittest -v tools/test_v14_build.py
          PYTHONPATH=tools python -m unittest -v tools/test_v14_migration_inventory.py
          python tools/v14_migration_inventory.py --inventory src/v14/migration-inventory.json

      - name: Check Python and JavaScript syntax
        run: |
          python -m py_compile tools/v14_rc_package.py
          python -m py_compile tools/v14_staging_package.py
          python -m py_compile acceptance/validate_v14_rc_acceptance.py
          node --check src/v14/shell/notifications.js
          node --check src/v14/shell/dialogs.js
          node --check src/v14/shell/commands.js
          node --check src/v14/shell/files.js
          node --check src/v14/shell/icons.js
          node --check src/v14/shell/text.js
          node --check src/v14/shell/units.js
          node --check src/v14/dev-status/dev-status.js
          node --check tools/v14-playwright.config.js
          node --check tools/v14-shell-smoke.spec.js
          node --check tools/v14-offline-pwa.spec.js

      - name: Validate dev.17 staging policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse
          plan=json.loads(Path('acceptance/v14-rc-required-targets.json').read_text('utf-8'))
          inventory=json.loads(Path('src/v14/migration-inventory.json').read_text('utf-8'))
          cutover=json.loads(Path('acceptance/v14-rc-cutover-plan.json').read_text('utf-8'))
          assert plan['schema']=='atelier-v14-rc-acceptance-plan-v2'
          assert plan['evidenceSchema']=='atelier-v14-rc-physical-acceptance-evidence-v2'
          assert plan['physicalSignoffSchema']=='atelier-v14-rc-physical-signoff-v2'
          dep=plan['candidateDeployment']
          assert dep['url']=='https://thiepn.github.io/atelier/v14-rc-staging/app/'
          assert dep['runnerUrl']=='https://thiepn.github.io/atelier/v14-rc-staging/acceptance.html'
          assert dep['productionUrl']=='https://thiepn.github.io/atelier/'
          assert urlparse(dep['url']).scheme=='https' and dep['url']!=dep['productionUrl']
          assert dep['productionRootRuntimeMustRemainImmutable'] is True
          targets=plan['targets']
          assert len(targets)==5 and len({t['id'] for t in targets})==5
          assert all('rc-identity' in t['requiredTests'] and 'no-dev-diagnostics' in t['requiredTests'] and 'cache-isolation' in t['requiredTests'] for t in targets)
          freeze=inventory['policy']['stabilization']; staging=freeze['staging']
          assert inventory['version']=='14.0.0-dev.17'
          assert freeze['architectureFrozen'] is True and freeze['allowProductionCutover'] is False
          assert staging['enabled'] is True and staging['publishBranch']=='main'
          assert staging['publishPath']=='v14-rc-staging/'
          assert staging['candidateUrl']==dep['url'] and staging['runnerUrl']==dep['runnerUrl']
          assert staging['productionRootRuntimeImmutable'] is True
          assert cutover['currentState']['productionCutover']=='blocked'
          print('V14_DEV17_STAGING_POLICY_OK=true targets=5 production_cutover=false')
          PY

      - name: Run shell/helper behavior tests
        run: |
          node tools/test_v14_notifications.mjs src/v14/shell/notifications.js
          node tools/test_v14_dialogs.mjs src/v14/shell/dialogs.js
          node tools/test_v14_commands.mjs src/v14/shell/commands.js
          node tools/test_v14_files.mjs src/v14/shell/files.js
          node tools/test_v14_icons.mjs src/v14/shell/icons.js
          node tools/test_v14_text.mjs src/v14/shell/text.js
          node tools/test_v14_units.mjs src/v14/shell/units.js

      - name: Verify frozen V14 baseline and round trip
        run: |
          python tools/v14_source.py verify-lock --input index.html --lock src/source.lock.json
          python tools/v14_source.py extract --input index.html --out .v14-source-check --lock src/source.lock.json --force
          python tools/v14_source.py check --input index.html --source .v14-source-check --lock src/source.lock.json

      - name: Build development, RC and staging artifacts
        run: |
          python tools/v14_build.py --repo-root . --manifest src/v14/manifest.json --output-dir v14-dist --force
          python tools/v14_rc_package.py --repo-root . --source-dir v14-dist --output-dir v14-rc --force
          python tools/v14_staging_package.py --repo-root . --rc-dir v14-rc --output-dir v14-staging --source-revision "$GITHUB_SHA" --force

      - name: Verify development, RC and staging identity
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          source=json.loads(Path('src/v14/manifest.json').read_text('utf-8'))
          inventory=json.loads(Path('src/v14/migration-inventory.json').read_text('utf-8'))
          plan=json.loads(Path('acceptance/v14-rc-required-targets.json').read_text('utf-8'))
          dev=json.loads(Path('v14-dist/v14-build-manifest.json').read_text('utf-8'))
          rc=json.loads(Path('v14-rc/v14-rc-status.json').read_text('utf-8'))
          staging=json.loads(Path('v14-staging/v14-rc-staging/staging-status.json').read_text('utf-8'))
          version='14.0.0-dev.17'
          assert source['version']==inventory['version']==dev['version']==rc['version']==staging['version']==version
          assert dev['developmentOnly'] is True
          assert rc['artifactKind']=='release-candidate' and rc['diagnosticsStripped'] is True
          assert rc['productionEligible'] is False
          assert rc['cache']==f'atelier-v14-rc-{version}'
          assert staging['candidateUrl']==plan['candidateDeployment']['url']
          assert staging['runnerUrl']==plan['candidateDeployment']['runnerUrl']
          assert staging['productionUrl']==plan['candidateDeployment']['productionUrl']
          assert staging['rcIndexSha256']==rc['indexSha256']
          assert staging['rcServiceWorkerSha256']==rc['serviceWorkerSha256']
          assert staging['rcCache']==rc['cache']
          def h(path): return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          assert h('v14-staging/v14-rc-staging/app/index.html')==rc['indexSha256']
          assert h('v14-staging/v14-rc-staging/app/sw.js')==rc['serviceWorkerSha256']
          runner=Path('v14-staging/v14-rc-staging/acceptance.html').read_text('utf-8')
          assert plan['evidenceSchema'] in runner
          assert plan['candidateDeployment']['url'] in runner
          assert 'rc-identity' in runner and 'no-dev-diagnostics' in runner and 'cache-isolation' in runner
          assert 'identityVerified' in runner
          assert rc['certificationGate']['blockers']==['prior-final-signoff-not-pass','runtime-advance-not-authorized','physical-evidence-incomplete']
          print('V14_DEV17_IDENTITY_OK=true staging_exact_rc=true evidence=0/5')
          PY
          node --check v14-dist/sw.js
          node --check v14-rc/sw.js

      - name: Self-test V14 RC evidence validator
        run: python acceptance/validate_v14_rc_acceptance.py --rc-status v14-rc/v14-rc-status.json --self-test

      - name: Verify promotion gate fails closed
        run: |
          set +e
          python tools/v14_rc_package.py --repo-root . --source-dir v14-dist --output-dir v14-rc-promotion-check --force --require-production-eligible
          code=$?
          set -e
          test "$code" -ne 0
          echo 'V14_RC_FAIL_CLOSED_OK=true'

      - name: Install Playwright browser matrix
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install --with-deps chromium firefox webkit

      - name: Run development browser matrix and offline smoke
        env:
          V14_SMOKE_URL: http://127.0.0.1:4173/
        run: |
          python -m http.server 4173 --directory v14-dist >/tmp/atelier-v14-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break || sleep 1; done
          npx playwright test v14-shell-smoke.spec.js --config=tools/v14-playwright.config.js --reporter=line --workers=1
          npx playwright test v14-offline-pwa.spec.js --config=tools/v14-playwright.config.js --project=chromium-desktop --reporter=line --workers=1

      - name: Run stripped RC Chromium and offline smoke
        run: |
          python -m http.server 4174 --directory v14-rc >/tmp/atelier-v14-rc-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do curl --fail --silent http://127.0.0.1:4174/ >/dev/null && break || sleep 1; done
          node - <<'NODE'
          const { chromium }=require('@playwright/test');
          (async()=>{const browser=await chromium.launch({headless:true}),context=await browser.newContext(),page=await context.newPage();
          await page.goto('http://127.0.0.1:4174/',{waitUntil:'networkidle'});const rc=await page.evaluate(async()=>fetch('./v14-rc-status.json',{cache:'no-store'}).then(r=>r.json()));
          await page.waitForFunction(()=>Boolean(globalThis.AtelierV14Shell?.units));if(await page.locator('#atelier-v14-devtools').count())throw Error('RC diagnostics present');
          await page.evaluate(async()=>navigator.serviceWorker.ready);if(!await page.evaluate(()=>Boolean(navigator.serviceWorker.controller)))await page.reload({waitUntil:'networkidle'});await page.waitForFunction(()=>Boolean(navigator.serviceWorker?.controller));
          const s=await page.evaluate(()=>new Promise((resolve,reject)=>{const c=navigator.serviceWorker.controller,ch=new MessageChannel(),t=setTimeout(()=>reject(Error('timeout')),5000);ch.port1.onmessage=e=>{clearTimeout(t);resolve(e.data)};c.postMessage({type:'GET_STATUS'},[ch.port2])}));if(s.version!==rc.version||s.cache!==rc.cache||!s.ready)throw Error('RC worker identity mismatch');
          await context.setOffline(true);await page.reload({waitUntil:'domcontentloaded',timeout:30000});await page.waitForFunction(()=>Boolean(globalThis.AtelierV14Shell?.units));if(!await page.locator('#app').isVisible())throw Error('RC offline shell missing');await context.setOffline(false);await browser.close();console.log('V14_RC_BROWSER_OK=true');})().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Run physical evidence runner browser smoke
        run: |
          python -m http.server 4175 --directory v14-staging >/tmp/atelier-v14-staging-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do curl --fail --silent http://127.0.0.1:4175/v14-rc-staging/acceptance.html >/dev/null && break || sleep 1; done
          node - <<'NODE'
          const fs=require('fs');const { chromium }=require('@playwright/test');
          (async()=>{const browser=await chromium.launch({headless:true}),page=await browser.newPage();await page.goto('http://127.0.0.1:4175/v14-rc-staging/acceptance.html',{waitUntil:'networkidle'});
          await page.waitForFunction(()=>document.querySelector('#environment')?.textContent.includes('"identityVerified": true'));
          await page.selectOption('#target','firefox-desktop');await page.fill('#tester','CI runner');await page.fill('#device','Chromium fixture');await page.fill('#os','Linux fixture');await page.fill('#browser','Chromium fixture');
          for(const sel of await page.locator('.test select').all())await sel.selectOption('PASS');await page.check('#attest');if(await page.locator('#gate').textContent()!=='EVIDENCE READY')throw Error('runner gate not ready');
          const [download]=await Promise.all([page.waitForEvent('download'),page.click('#export')]);await download.saveAs('/tmp/v14-staging-evidence.json');const ev=JSON.parse(fs.readFileSync('/tmp/v14-staging-evidence.json','utf8'));const st=JSON.parse(fs.readFileSync('v14-staging/v14-rc-staging/staging-status.json','utf8'));
          if(ev.schema!=='atelier-v14-rc-physical-acceptance-evidence-v2'||ev.candidateUrl!==st.candidateUrl||ev.runnerUrl!==st.runnerUrl||ev.rcVersion!==st.version||ev.rcIndexSha256!==st.rcIndexSha256||ev.rcServiceWorkerSha256!==st.rcServiceWorkerSha256)throw Error('runner evidence identity mismatch');
          await browser.close();console.log('V14_PHYSICAL_RUNNER_OK=true exact_candidate=true');})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          PYTHONPATH=acceptance python - <<'PY'
          import json
          import validate_v14_rc_acceptance as v
          status=v.load_rc_status('v14-rc/v14-rc-status.json')
          tid,data,errors=v.validate_file('/tmp/v14-staging-evidence.json',status)
          assert tid=='firefox-desktop' and not errors, errors
          assert data['candidateUrl']=='https://thiepn.github.io/atelier/v14-rc-staging/app/'
          print('V14_PHYSICAL_RUNNER_VALIDATOR_COMPATIBLE=true')
          PY

      - name: Resolve artifact names
        id: artifact_meta
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          version=json.load(open('src/v14/manifest.json',encoding='utf-8'))['version'];suffix=version.removeprefix('14.0.0-')
          print(f'dev_name=atelier-v14-{suffix}')
          print(f'rc_name=atelier-v14-{suffix}-rc')
          print(f'staging_name=atelier-v14-{suffix}-staging')
          PY

      - name: Upload V14 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_meta.outputs.dev_name }}
          path: v14-dist
          include-hidden-files: true
          retention-days: 14

      - name: Upload V14 RC artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_meta.outputs.rc_name }}
          path: v14-rc
          include-hidden-files: true
          retention-days: 14

      - name: Upload V14 staging artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_meta.outputs.staging_name }}
          path: v14-staging
          include-hidden-files: true
          retention-days: 14

      - name: Check out production branch for isolated staging publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/v14-development'
        uses: actions/checkout@v4
        with:
          ref: main
          path: production-site
          persist-credentials: true

      - name: Publish staging subtree without changing production runtime
        if: github.event_name == 'push' && github.ref == 'refs/heads/v14-development'
        run: |
          EXPECTED_INDEX=561d258b10835af1a8dc6719ce411cd05eff53e31713bc73fb733169649cfc46
          EXPECTED_SW=e8767e445516647851fe5053a3b5c9dd140e0c04ecc719fbfe5eb801094f5236
          test "$(sha256sum production-site/index.html | awk '{print $1}')" = "$EXPECTED_INDEX"
          test "$(sha256sum production-site/sw.js | awk '{print $1}')" = "$EXPECTED_SW"
          rm -rf production-site/v14-rc-staging
          cp -a v14-staging/v14-rc-staging production-site/v14-rc-staging
          test "$(sha256sum production-site/index.html | awk '{print $1}')" = "$EXPECTED_INDEX"
          test "$(sha256sum production-site/sw.js | awk '{print $1}')" = "$EXPECTED_SW"
          cd production-site
          git config user.name 'atelier-v14-staging-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add v14-rc-staging
          if git diff --cached --quiet; then echo 'V14_STAGING_PUBLISH=no-change'; exit 0; fi
          git commit -m "Publish Atelier V14 dev.17 RC staging"
          git push origin HEAD:main
          echo 'V14_STAGING_PUBLISH=updated'

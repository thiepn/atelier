name: V14 source, RC staging and physical evidence runner

on:
  push:
    branches: [v14-development]
    paths:
      - '.github/workflows/v14-source-roundtrip.yml'
      - 'index.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'icon-192.png'
      - 'icon-512.png'
      - '.nojekyll'
      - 'src/**'
      - 'tools/**'
      - 'acceptance/DEVICE_ACCEPTANCE_13.3.0.html'
      - 'acceptance/v14-rc-required-targets.json'
      - 'acceptance/v14-rc-cutover-plan.json'
      - 'acceptance/validate_v14_rc_acceptance.py'
      - 'CERTIFICATION_MATRIX_13.3.1.json'
  pull_request:
    branches: [v14-development]
    paths:
      - '.github/workflows/v14-source-roundtrip.yml'
      - 'index.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'icon-192.png'
      - 'icon-512.png'
      - '.nojekyll'
      - 'src/**'
      - 'tools/**'
      - 'acceptance/DEVICE_ACCEPTANCE_13.3.0.html'
      - 'acceptance/v14-rc-required-targets.json'
      - 'acceptance/v14-rc-cutover-plan.json'
      - 'acceptance/validate_v14_rc_acceptance.py'
      - 'CERTIFICATION_MATRIX_13.3.1.json'

concurrency:
  group: v14-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-packaging-staging:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.artifact_meta.outputs.version }}
      dev_name: ${{ steps.artifact_meta.outputs.dev_name }}
      rc_name: ${{ steps.artifact_meta.outputs.rc_name }}
      staging_name: ${{ steps.artifact_meta.outputs.staging_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run deterministic unit tests
        run: |
          PYTHONPATH=tools python -m unittest -v tools/test_v14_source.py
          PYTHONPATH=tools python -m unittest -v tools/test_v14_build.py
          PYTHONPATH=tools python -m unittest -v tools/test_v14_migration_inventory.py
          python tools/v14_migration_inventory.py --inventory src/v14/migration-inventory.json

      - name: Check Python and JavaScript syntax
        run: |
          python -m py_compile tools/v14_rc_package.py
          python -m py_compile tools/v14_staging_package.py
          python -m py_compile acceptance/validate_v14_rc_acceptance.py
          node --check src/v14/shell/notifications.js
          node --check src/v14/shell/dialogs.js
          node --check src/v14/shell/commands.js
          node --check src/v14/shell/files.js
          node --check src/v14/shell/icons.js
          node --check src/v14/shell/text.js
          node --check src/v14/shell/units.js
          node --check src/v14/dev-status/dev-status.js
          node --check tools/v14-playwright.config.js
          node --check tools/v14-shell-smoke.spec.js
          node --check tools/v14-offline-pwa.spec.js
          node --check tools/v14-cache-isolation.spec.js

      - name: Validate dev.19 staging and certification policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import parse_qs,urlparse
          version='14.0.0-dev.19'
          plan=json.loads(Path('acceptance/v14-rc-required-targets.json').read_text('utf-8'))
          inventory=json.loads(Path('src/v14/migration-inventory.json').read_text('utf-8'))
          cutover=json.loads(Path('acceptance/v14-rc-cutover-plan.json').read_text('utf-8'))
          assert plan['schema']=='atelier-v14-rc-acceptance-plan-v3'
          assert plan['evidenceSchema']=='atelier-v14-rc-physical-acceptance-evidence-v3'
          assert plan['physicalSignoffSchema']=='atelier-v14-rc-physical-signoff-v3'
          dep=plan['candidateDeployment'];expected_base=f'https://thiepn.github.io/atelier/v14-rc-staging/{version}/'
          assert dep['url']==expected_base+'app/'
          assert dep['runnerUrl']==expected_base+f'acceptance.html?v={version}'
          assert dep['statusUrl']==expected_base+'staging-status.json'
          assert dep['productionUrl']=='https://thiepn.github.io/atelier/'
          assert dep['versionedPathRequired'] is True and dep['preservePriorCandidates'] is True and dep['runnerCacheBustRequired'] is True
          assert urlparse(dep['url']).scheme=='https' and dep['url']!=dep['productionUrl']
          assert parse_qs(urlparse(dep['runnerUrl']).query)=={'v':[version]}
          targets=plan['targets'];assert len(targets)==5 and len({t['id'] for t in targets})==5
          assert all('rc-identity' in t['requiredTests'] and 'no-dev-diagnostics' in t['requiredTests'] and 'cache-isolation' in t['requiredTests'] for t in targets)
          freeze=inventory['policy']['stabilization'];staging=freeze['staging'];worker=freeze['serviceWorker']
          assert inventory['version']==version
          assert freeze['architectureFrozen'] is True and freeze['allowProductionCutover'] is False
          assert worker['ownCacheLookupOnly'] is True and worker['crossNamespaceReadsForbidden'] is True
          assert staging['versionedCandidatePath'] is True and staging['preservePriorCandidates'] is True
          assert staging['candidatePath']==f'v14-rc-staging/{version}/'
          assert staging['candidateUrl']==dep['url'] and staging['runnerUrl']==dep['runnerUrl'] and staging['statusUrl']==dep['statusUrl']
          assert staging['productionRootRuntimeImmutable'] is True and staging['liveHttpsVerificationRequired'] is True
          assert cutover['schema']=='atelier-v14-rc-cutover-plan-v2'
          assert cutover['staging']['requirement']=='live-https-verification-before-physical-evidence'
          assert cutover['staging']['operationalStateSource']=='CERTIFICATION_MATRIX_14.0.0-rc.json'
          assert cutover['statePolicy']['operationalStateMustBeRecordedInCertificationMatrix'] is True
          assert cutover['statePolicy']['productionCutoverDefault']=='blocked'
          print('V14_DEV19_POLICY_OK=true targets=5 immutable_staging=true own_cache_only=true promotion_fail_closed=true')
          PY

      - name: Run shell/helper behavior tests
        run: |
          node tools/test_v14_notifications.mjs src/v14/shell/notifications.js
          node tools/test_v14_dialogs.mjs src/v14/shell/dialogs.js
          node tools/test_v14_commands.mjs src/v14/shell/commands.js
          node tools/test_v14_files.mjs src/v14/shell/files.js
          node tools/test_v14_icons.mjs src/v14/shell/icons.js
          node tools/test_v14_text.mjs src/v14/shell/text.js
          node tools/test_v14_units.mjs src/v14/shell/units.js

      - name: Verify frozen V14 baseline and round trip
        run: |
          python tools/v14_source.py verify-lock --input index.html --lock src/source.lock.json
          python tools/v14_source.py extract --input index.html --out .v14-source-check --lock src/source.lock.json --force
          python tools/v14_source.py check --input index.html --source .v14-source-check --lock src/source.lock.json

      - name: Build development, RC and immutable staging artifacts
        run: |
          python tools/v14_build.py --repo-root . --manifest src/v14/manifest.json --output-dir v14-dist --force
          python tools/v14_rc_package.py --repo-root . --source-dir v14-dist --output-dir v14-rc --force
          python tools/v14_staging_package.py --repo-root . --rc-dir v14-rc --output-dir v14-staging --source-revision "$GITHUB_SHA" --force

      - name: Verify development, RC and staging identity
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          version='14.0.0-dev.19'
          source=json.loads(Path('src/v14/manifest.json').read_text('utf-8'))
          inventory=json.loads(Path('src/v14/migration-inventory.json').read_text('utf-8'))
          plan=json.loads(Path('acceptance/v14-rc-required-targets.json').read_text('utf-8'))
          dev=json.loads(Path('v14-dist/v14-build-manifest.json').read_text('utf-8'))
          rc_build=json.loads(Path('v14-rc/v14-build-manifest.json').read_text('utf-8'))
          rc=json.loads(Path('v14-rc/v14-rc-status.json').read_text('utf-8'))
          root=Path('v14-staging/v14-rc-staging')/version
          staging=json.loads((root/'staging-status.json').read_text('utf-8'))
          assert source['version']==inventory['version']==dev['version']==rc['version']==staging['version']==version
          assert dev['developmentOnly'] is True
          assert dev['serviceWorker']['ownCacheLookupOnly'] is True and dev['serviceWorker']['cacheLookupIsolationReplacements']==3
          assert 'caches.match(' not in Path('v14-dist/sw.js').read_text('utf-8')
          assert rc['artifactKind']=='release-candidate' and rc['diagnosticsStripped'] is True and rc['ownCacheLookupOnly'] is True
          assert rc['productionEligible'] is False and rc_build['serviceWorker']['ownCacheLookupOnly'] is True
          assert 'caches.match(' not in Path('v14-rc/sw.js').read_text('utf-8')
          assert rc['cache']==f'atelier-v14-rc-{version}'
          gate=rc['certificationGate']
          assert gate['priorReleaseGateReady'] is False and gate['promotionEligible'] is False
          assert gate['priorReleaseBlockers']==['prior-final-signoff-not-pass','runtime-advance-not-authorized','physical-evidence-incomplete']
          assert gate['blockers']==['prior-final-signoff-not-pass','runtime-advance-not-authorized','physical-evidence-incomplete','v14-physical-signoff-required','v14-cutover-verification-required']
          assert staging['schema']=='atelier-v14-staging-status-v2'
          assert staging['candidatePath']==f'v14-rc-staging/{version}/'
          assert staging['candidateUrl']==plan['candidateDeployment']['url'] and staging['runnerUrl']==plan['candidateDeployment']['runnerUrl'] and staging['statusUrl']==plan['candidateDeployment']['statusUrl']
          assert staging['immutableCandidatePath'] is True and staging['priorCandidatesPreserved'] is True and staging['ownCacheLookupOnly'] is True
          assert staging['productionEligible'] is False
          assert staging['sourceRevision']==os.environ['GITHUB_SHA']
          assert staging['rcIndexSha256']==rc['indexSha256'] and staging['rcServiceWorkerSha256']==rc['serviceWorkerSha256']
          def h(path): return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          assert h(root/'app/index.html')==rc['indexSha256'] and h(root/'app/sw.js')==rc['serviceWorkerSha256']
          runner=(root/'acceptance.html').read_text('utf-8')
          assert plan['evidenceSchema'] in runner and plan['candidateDeployment']['url'] in runner and plan['candidateDeployment']['statusUrl'] in runner
          assert 'arrayBuffer()' in runner and 'rcStatusVerified' in runner and 'identityVerified' in runner
          print('V14_DEV19_IDENTITY_OK=true staging_exact_rc=true evidence=0/5 promotion=false')
          PY
          node --check v14-dist/sw.js
          node --check v14-rc/sw.js

      - name: Self-test strict V14 RC evidence validator
        run: python acceptance/validate_v14_rc_acceptance.py --rc-status v14-rc/v14-rc-status.json --self-test

      - name: Verify production promotion gate fails closed
        run: |
          set +e
          python tools/v14_rc_package.py --repo-root . --source-dir v14-dist --output-dir v14-rc-promotion-check --force --require-production-eligible
          code=$?
          set -e
          test "$code" -ne 0
          echo 'V14_RC_PRODUCTION_PROMOTION_FAIL_CLOSED_OK=true'

      - name: Install Playwright browser matrix
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install --with-deps chromium firefox webkit

      - name: Start development test server
        run: |
          nohup python -m http.server 4173 --directory v14-dist >/tmp/atelier-v14-http.log 2>&1 &
          for attempt in {1..20}; do curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0 || sleep 1; done
          exit 1

      - name: Browser smoke — Chromium desktop
        env: { V14_SMOKE_URL: 'http://127.0.0.1:4173/' }
        run: npx playwright test v14-shell-smoke.spec.js --config=tools/v14-playwright.config.js --project=chromium-desktop --reporter=line --workers=1

      - name: Browser smoke — Chromium mobile touch
        env: { V14_SMOKE_URL: 'http://127.0.0.1:4173/' }
        run: npx playwright test v14-shell-smoke.spec.js --config=tools/v14-playwright.config.js --project=chromium-mobile --reporter=line --workers=1

      - name: Browser smoke — Firefox desktop
        env: { V14_SMOKE_URL: 'http://127.0.0.1:4173/' }
        run: npx playwright test v14-shell-smoke.spec.js --config=tools/v14-playwright.config.js --project=firefox-desktop --reporter=line --workers=1

      - name: Browser smoke — WebKit desktop
        env: { V14_SMOKE_URL: 'http://127.0.0.1:4173/' }
        run: npx playwright test v14-shell-smoke.spec.js --config=tools/v14-playwright.config.js --project=webkit-desktop --reporter=line --workers=1

      - name: Browser smoke — WebKit phone touch
        env: { V14_SMOKE_URL: 'http://127.0.0.1:4173/' }
        run: npx playwright test v14-shell-smoke.spec.js --config=tools/v14-playwright.config.js --project=webkit-mobile --reporter=line --workers=1

      - name: Browser smoke — WebKit tablet touch
        env: { V14_SMOKE_URL: 'http://127.0.0.1:4173/' }
        run: npx playwright test v14-shell-smoke.spec.js --config=tools/v14-playwright.config.js --project=webkit-tablet --reporter=line --workers=1

      - name: Development offline PWA smoke
        env: { V14_SMOKE_URL: 'http://127.0.0.1:4173/' }
        run: npx playwright test v14-offline-pwa.spec.js --config=tools/v14-playwright.config.js --project=chromium-desktop --reporter=line --workers=1

      - name: Development cross-cache poison regression
        env: { V14_SMOKE_URL: 'http://127.0.0.1:4173/' }
        run: npx playwright test v14-cache-isolation.spec.js --config=tools/v14-playwright.config.js --project=chromium-desktop --reporter=line --workers=1

      - name: Run stripped RC Chromium, offline and cache-isolation smoke
        env:
          V14_SMOKE_URL: http://127.0.0.1:4174/
        run: |
          python -m http.server 4174 --directory v14-rc >/tmp/atelier-v14-rc-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do curl --fail --silent http://127.0.0.1:4174/ >/dev/null && break || sleep 1; done
          npx playwright test v14-cache-isolation.spec.js --config=tools/v14-playwright.config.js --project=chromium-desktop --reporter=line --workers=1
          node - <<'NODE'
          const { chromium }=require('@playwright/test');
          (async()=>{const browser=await chromium.launch({headless:true}),context=await browser.newContext(),page=await context.newPage();
          await page.goto(process.env.V14_SMOKE_URL,{waitUntil:'networkidle'});const rc=await page.evaluate(async()=>fetch('./v14-rc-status.json',{cache:'no-store'}).then(r=>r.json()));
          await page.waitForFunction(()=>Boolean(globalThis.AtelierV14Shell?.units));if(await page.locator('#atelier-v14-devtools').count())throw Error('RC diagnostics present');if(rc.ownCacheLookupOnly!==true||rc.productionEligible!==false)throw Error('RC fail-closed metadata missing');
          await page.evaluate(async()=>navigator.serviceWorker.ready);if(!await page.evaluate(()=>Boolean(navigator.serviceWorker.controller)))await page.reload({waitUntil:'networkidle'});await page.waitForFunction(()=>Boolean(navigator.serviceWorker?.controller));
          const s=await page.evaluate(()=>new Promise((resolve,reject)=>{const c=navigator.serviceWorker.controller,ch=new MessageChannel(),t=setTimeout(()=>reject(Error('timeout')),5000);ch.port1.onmessage=e=>{clearTimeout(t);resolve(e.data)};c.postMessage({type:'GET_STATUS'},[ch.port2])}));if(s.version!==rc.version||s.cache!==rc.cache||!s.ready)throw Error('RC worker identity mismatch');
          await context.setOffline(true);await page.reload({waitUntil:'domcontentloaded',timeout:30000});await page.waitForFunction(()=>Boolean(globalThis.AtelierV14Shell?.units));if(!await page.locator('#app').isVisible())throw Error('RC offline shell missing');await context.setOffline(false);await browser.close();console.log('V14_RC_BROWSER_OK=true own_cache_only=true production_eligible=false');})().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Run physical evidence runner browser smoke
        run: |
          VERSION=14.0.0-dev.19
          python -m http.server 4175 --directory v14-staging >/tmp/atelier-v14-staging-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          LOCAL_RUNNER="http://127.0.0.1:4175/v14-rc-staging/$VERSION/acceptance.html?v=$VERSION"
          for attempt in {1..20}; do curl --fail --silent "$LOCAL_RUNNER" >/dev/null && break || sleep 1; done
          node - <<'NODE'
          const fs=require('fs');const { chromium }=require('@playwright/test');const version='14.0.0-dev.19';
          (async()=>{const browser=await chromium.launch({headless:true}),page=await browser.newPage({acceptDownloads:true});const url=`http://127.0.0.1:4175/v14-rc-staging/${version}/acceptance.html?v=${version}`;await page.goto(url,{waitUntil:'networkidle'});
          await page.waitForFunction(()=>document.querySelector('#environment')?.textContent.includes('"identityVerified": true'));
          await page.selectOption('#target','firefox-desktop');await page.fill('#tester','CI runner');await page.fill('#device','Chromium fixture');await page.fill('#os','Linux fixture');await page.fill('#browser','Chromium fixture');
          for(const sel of await page.locator('.test select').all())await sel.selectOption('PASS');await page.check('#attest');if(await page.locator('#gate').textContent()!=='EVIDENCE READY')throw Error('runner gate not ready');
          const [download]=await Promise.all([page.waitForEvent('download'),page.click('#export')]);await download.saveAs('/tmp/v14-staging-evidence.json');const ev=JSON.parse(fs.readFileSync('/tmp/v14-staging-evidence.json','utf8'));const root=`v14-staging/v14-rc-staging/${version}`;const st=JSON.parse(fs.readFileSync(`${root}/staging-status.json`,'utf8'));
          if(ev.schema!=='atelier-v14-rc-physical-acceptance-evidence-v3'||ev.candidateUrl!==st.candidateUrl||ev.runnerUrl!==st.runnerUrl||ev.stagingStatusUrl!==st.statusUrl||ev.rcVersion!==st.version||ev.rcIndexSha256!==st.rcIndexSha256||ev.rcServiceWorkerSha256!==st.rcServiceWorkerSha256)throw Error('runner evidence identity mismatch');
          await browser.close();console.log('V14_PHYSICAL_RUNNER_OK=true exact_candidate=true schema=v3');})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          PYTHONPATH=acceptance python - <<'PY'
          import validate_v14_rc_acceptance as v
          status=v.load_rc_status('v14-rc/v14-rc-status.json')
          tid,data,errors=v.validate_file('/tmp/v14-staging-evidence.json',status)
          assert tid=='firefox-desktop' and not errors, errors
          assert data['candidateUrl']==v.DEPLOYMENT['url'] and data['runnerUrl']==v.DEPLOYMENT['runnerUrl'] and data['stagingStatusUrl']==v.DEPLOYMENT['statusUrl']
          print('V14_PHYSICAL_RUNNER_VALIDATOR_COMPATIBLE=true schema=v3 production_promotion_ready=false')
          PY

      - name: Resolve artifact names
        id: artifact_meta
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          version=json.load(open('src/v14/manifest.json',encoding='utf-8'))['version'];suffix=version.removeprefix('14.0.0-')
          print(f'version={version}')
          print(f'dev_name=atelier-v14-{suffix}')
          print(f'rc_name=atelier-v14-{suffix}-rc')
          print(f'staging_name=atelier-v14-{suffix}-staging')
          PY

      - name: Upload V14 development artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_meta.outputs.dev_name }}
          path: v14-dist
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Upload V14 RC artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_meta.outputs.rc_name }}
          path: v14-rc
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Upload immutable V14 staging artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_meta.outputs.staging_name }}
          path: v14-staging
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  publish-staging:
    needs: source-packaging-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/v14-development'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated staging artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.source-packaging-staging.outputs.staging_name }}
          path: downloaded-staging

      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: production-site
          persist-credentials: true

      - name: Publish immutable versioned staging candidate
        env:
          VERSION: ${{ needs.source-packaging-staging.outputs.version }}
        run: |
          set -euo pipefail
          EXPECTED_INDEX=561d258b10835af1a8dc6719ce411cd05eff53e31713bc73fb733169649cfc46
          EXPECTED_SW=e8767e445516647851fe5053a3b5c9dd140e0c04ecc719fbfe5eb801094f5236
          test "$(sha256sum production-site/index.html | awk '{print $1}')" = "$EXPECTED_INDEX"
          test "$(sha256sum production-site/sw.js | awk '{print $1}')" = "$EXPECTED_SW"
          SOURCE="downloaded-staging/v14-rc-staging/$VERSION"
          DEST="production-site/v14-rc-staging/$VERSION"
          test -f "$SOURCE/staging-status.json"
          python - "$SOURCE/staging-status.json" "$VERSION" <<'PY'
          import json,sys
          status=json.load(open(sys.argv[1],encoding='utf-8'));version=sys.argv[2]
          assert status['schema']=='atelier-v14-staging-status-v2' and status['version']==version
          assert status['candidatePath']==f'v14-rc-staging/{version}/'
          assert status['immutableCandidatePath'] is True and status['priorCandidatesPreserved'] is True and status['ownCacheLookupOnly'] is True
          assert status['productionEligible'] is False
          PY
          mkdir -p production-site/v14-rc-staging
          if [ -e "$DEST" ]; then
            if diff -qr "$SOURCE" "$DEST" >/dev/null; then
              echo 'V14_STAGING_PUBLISH=no-change'
            else
              echo "ERROR: immutable staging path already exists with different bytes: $VERSION" >&2
              exit 1
            fi
          else
            cp -a "$SOURCE" "$DEST"
          fi
          test "$(sha256sum production-site/index.html | awk '{print $1}')" = "$EXPECTED_INDEX"
          test "$(sha256sum production-site/sw.js | awk '{print $1}')" = "$EXPECTED_SW"
          cd production-site
          git config user.name 'atelier-v14-staging-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add "v14-rc-staging/$VERSION"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish Atelier V14 $VERSION immutable RC staging"
          git push origin HEAD:main

      - name: Verify live HTTPS staging and frozen production root
        env:
          VERSION: ${{ needs.source-packaging-staging.outputs.version }}
        run: |
          set -euo pipefail
          LOCAL="downloaded-staging/v14-rc-staging/$VERSION/staging-status.json"
          REV=$(python -c "import json;print(json.load(open('$LOCAL'))['sourceRevision'])")
          STATUS="https://thiepn.github.io/atelier/v14-rc-staging/$VERSION/staging-status.json"
          RUNNER="https://thiepn.github.io/atelier/v14-rc-staging/$VERSION/acceptance.html?v=$VERSION"
          APP="https://thiepn.github.io/atelier/v14-rc-staging/$VERSION/app/"
          PROD="https://thiepn.github.io/atelier/"
          for attempt in {1..60}; do
            if curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "$STATUS?r=$REV" -o /tmp/live-status.json; then
              if python - "$LOCAL" /tmp/live-status.json <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1]));b=json.load(open(sys.argv[2]));raise SystemExit(0 if a==b else 1)
          PY
              then break; fi
            fi
            sleep 3
          done
          curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "$STATUS?r=$REV" -o /tmp/live-status.json
          curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "$RUNNER&r=$REV" -o /tmp/live-runner.html
          curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "${APP}index.html?v=$VERSION&r=$REV" -o /tmp/live-index.html
          curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "${APP}sw.js?v=$VERSION&r=$REV" -o /tmp/live-sw.js
          curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "${PROD}?audit=$REV" -o /tmp/live-production-index.html
          curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "${PROD}sw.js?audit=$REV" -o /tmp/live-production-sw.js
          python - "$LOCAL" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          def h(path): return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          local=json.load(open(sys.argv[1],encoding='utf-8'));live=json.load(open('/tmp/live-status.json',encoding='utf-8'))
          assert live==local
          assert live['schema']=='atelier-v14-staging-status-v2'
          assert live['immutableCandidatePath'] is True and live['priorCandidatesPreserved'] is True and live['ownCacheLookupOnly'] is True
          assert live['productionEligible'] is False
          assert h('/tmp/live-index.html')==live['rcIndexSha256'] and h('/tmp/live-sw.js')==live['rcServiceWorkerSha256']
          assert h('/tmp/live-production-index.html')=='561d258b10835af1a8dc6719ce411cd05eff53e31713bc73fb733169649cfc46'
          assert h('/tmp/live-production-sw.js')=='e8767e445516647851fe5053a3b5c9dd140e0c04ecc719fbfe5eb801094f5236'
          runner=Path('/tmp/live-runner.html').read_text('utf-8')
          assert live['candidateUrl'] in runner and live['statusUrl'] in runner
          assert 'atelier-v14-rc-physical-acceptance-evidence-v3' in runner and 'arrayBuffer()' in runner and 'rcStatusVerified' in runner
          print('V14_LIVE_HTTPS_STAGING_OK=true immutable=true')
          print('V14_LIVE_RC_IDENTITY_OK=true version='+live['version'])
          print('V14_LIVE_PRODUCTION_ROOT_IMMUTABLE=true')
          print('V14_REAL_PHYSICAL_EVIDENCE=0/5')
          print('V14_PRODUCTION_PROMOTION_READY=false')
          PY

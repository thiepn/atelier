name: Publish Atelier V12.1.3

on:
  push:
    branches: [publish-v12.1.3]
    paths: [.github/workflows/publish-v12.1.3.yml]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download, verify and publish exact release
        shell: bash
        run: |
          set -euo pipefail
          ZIP=/tmp/atelier-v12.1.3.zip
          OUT=/tmp/atelier-v12.1.3
          curl --fail --location --silent --show-error 'https://uc11d9f4be2eea64e0d2493769f4.dl.dropboxusercontent.com/cd/0/get/DIAxtitlx6XJ7-_f_m7XCpUrGyf3zDA0ZMPKC2hx0yoWwE4QFVRNmKsQWM2pMnjgxZX9PDGqTnlBvNEkzWO4YmiGMxpsylf8lx0LDFifCydiRw8l4EZ-5VGzEPQMh83LLVYH7VpW7eRpDRo0FX8qPw3pLOwoevvWBS7hGUmgUNJcag/file?c_luid=39011dda' -o "$ZIP"
          echo '3b30f637df867632533ea041a24a78d09808bef6eb91473c9fc692c5c0d91f93  /tmp/atelier-v12.1.3.zip' | sha256sum -c -
          rm -rf "$OUT"
          mkdir -p "$OUT"
          unzip -q "$ZIP" -d "$OUT"
          echo '109435f0fc99a8bfca55b2d1dd30098c1d5b96aa0db9a99d45bd477839e0ce2a  /tmp/atelier-v12.1.3/index.html' | sha256sum -c -
          rm -f PERFORMANCE_HOTFIX_REPORT_12.1.2.md RELEASE_NOTES_12.1.2.md TEST_REPORT_12.1.2.md
          cp "$OUT/index.html" index.html
          cp "$OUT/manifest.webmanifest" manifest.webmanifest
          cp "$OUT/sw.js" sw.js
          cp "$OUT/icon-192.png" icon-192.png
          cp "$OUT/icon-512.png" icon-512.png
          cp "$OUT/README.md" README.md
          cp "$OUT/RELEASE_NOTES_12.1.3.md" RELEASE_NOTES_12.1.3.md
          cp "$OUT/TEST_REPORT_12.1.3.md" TEST_REPORT_12.1.3.md
          cp "$OUT/PERFORMANCE_SMOOTH_INTERACTION_REPORT_12.1.3.md" PERFORMANCE_SMOOTH_INTERACTION_REPORT_12.1.3.md
          touch .nojekyll
          rm -f .github/workflows/publish-v12.1.3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish Atelier Space Studio 12.1.3 smooth interaction'
          git push origin HEAD:publish-v12.1.3
